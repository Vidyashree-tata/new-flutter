name: DEV Environment CI/CD

# Trigger on develop branch and feature branches
on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'DEV'
        type: choice
        options:
          - DEV

env:
  FLUTTER_VERSION: '3.19.0'
  ENVIRONMENT: 'DEV'

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build and Test - DEV
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: |
          flutter doctor -v
          flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Build DEV APK (Debug)
        run: flutter build apk --debug
        env:
          ENVIRONMENT: DEV

      - name: Upload DEV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### Build Summary - DEV Environment :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** DEV" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Version:** ${{ env.FLUTTER_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY

  # Job 2: Deploy to DEV (runs after build succeeds)
  deploy-dev:
    name: Deploy to DEV Environment
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: DEV
      url: https://dev.yourapp.com
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DEV APK
        uses: actions/download-artifact@v4.1.3
        with:
          name: dev-apk-${{ github.sha }}
          path: ./artifacts

      - name: Verify APK
        run: |
          echo "Verifying DEV APK..."
          ls -lah ./artifacts/
          file ./artifacts/app-debug.apk

      - name: Deploy Information
        run: |
          echo "### Deployment Information - DEV :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** DEV" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed At:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK is ready for deployment to DEV environment"

      # Add your actual deployment steps here
      # Examples:
      # - Upload to Firebase App Distribution
      # - Upload to Google Play Internal Testing
      # - Upload to App Center
      # - Deploy to custom hosting
      
      # Example Firebase App Distribution (uncomment and configure):
      # - name: Deploy to Firebase App Distribution
      #   uses: wzieba/Firebase-Distribution-Github-Action@v1
      #   with:
      #     appId: ${{ secrets.FIREBASE_APP_ID_DEV }}
      #     token: ${{ secrets.FIREBASE_TOKEN }}
      #     groups: dev-testers
      #     file: ./artifacts/app-debug.apk
      #     releaseNotes: |
      #       DEV Build from commit ${{ github.sha }}
      #       Branch: ${{ github.ref_name }}

      - name: Deployment Success
        run: |
          echo "✅ Successfully deployed to DEV environment"
          echo "APK Location: ./artifacts/app-debug.apk"
